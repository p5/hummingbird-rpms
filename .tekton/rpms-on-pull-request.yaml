---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.com/redhat/hummingbird/rpms/-/tree/{{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-path-change: "[rpms/bash/***, test/rpms/bash.yml]"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rpms-main
    appstudio.openshift.io/component: bash-main
    pipelines.appstudio.openshift.io/type: build
  name: bash-main-on-pull-request
  namespace: hummingbird-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: image-expires-after
      value: 5d
    - name: ociStorage
      value: quay.io/redhat-user-workloads/hummingbird-tenant/bash-main:on-mr-{{pull_request_number}}-{{revision}}
    - name: package-name
      value: bash
    - name: target-branch
      value: '{{target_branch}}'
    - name: build-architectures
      value:
        - aarch64
        - x86_64
    - name: specfile
      value: "bash.spec"
    - name: monorepo-subdir
      value: "rpms/bash"
    - name: mock-config-template-file
      value: "mock/mock.cfg"
    - name: self-ref-url
      value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
    - name: self-ref-revision
      value: "616676a13160636e30f571c49eda1d1ee63c30f9"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: "https://github.com/konflux-ci/rpmbuild-pipeline.git"
      - name: revision
        value: "616676a13160636e30f571c49eda1d1ee63c30f9"
      - name: pathInRepo
        value: "pipeline/build-rpm-package.yaml"
  taskRunTemplate:
    serviceAccountName: build-pipeline-bash-main
  timeouts:
    pipeline: 12h
    tasks: 12h
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{git_auth_secret}}'
