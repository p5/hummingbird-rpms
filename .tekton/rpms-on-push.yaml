apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.com/redhat/hummingbird/rpms/-/tree/{{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-path-change: "[rpms/R-rpm-macros/***]"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rpms-main
    appstudio.openshift.io/component: r-rpm-macros-main
    pipelines.appstudio.openshift.io/type: build
  name: r-rpm-macros-main-on-push
  namespace: hummingbird-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: ociStorage
      value: quay.io/redhat-user-workloads/hummingbird-tenant/r-rpm-macros-main:{{revision}}
    - name: package-name
      value: R-rpm-macros
    - name: target-branch
      value: '{{target_branch}}'
    - name: build-architectures
      value:
        - aarch64
        - x86_64
    - name: specfile
      value: "R-rpm-macros.spec"
    - name: monorepo-subdir
      value: "rpms/R-rpm-macros"
    - name: mock-config-template-filename-in-sources
      value: "mock/mock.cfg"
  pipelineRef:
    resolver: bundles
    params:
      - name: name
        value: build-rpm-package
      - name: kind
        value: pipeline
      - name: bundle
        # renovate: datasource=docker depName=quay.io/hummingbird-ci/rpmbuild-pipeline
        value: "quay.io/hummingbird-ci/rpmbuild-pipeline:latest@sha256:2a2e8ed52aa55c13fb7b919992a690c1da56470394ea95460793d52324bb6b3f"
  taskRunTemplate:
    serviceAccountName: build-pipeline-r-rpm-macros-main
  timeouts:
    pipeline: 4h
    tasks: 4h
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{git_auth_secret}}'
