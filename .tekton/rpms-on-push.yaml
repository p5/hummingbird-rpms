# --- CUnit ---
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://gitlab.com/redhat/hummingbird/rpms/-/tree/{{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-path-change: "[rpms/CUnit/***]"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: rpms-main
    appstudio.openshift.io/component: cunit-main
    pipelines.appstudio.openshift.io/type: build
  name: cunit-main-on-push
  namespace: hummingbird-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: ociStorage
      value: quay.io/redhat-user-workloads/hummingbird-tenant/cunit-main:{{revision}}
    - name: package-name
      value: CUnit
    - name: target-branch
      value: '{{target_branch}}'
    - name: build-architectures
      value:
        - aarch64
        - x86_64
    - name: build-platforms
      value:
        - "linux/amd64"
        - "linux/arm64"
    - name: specfile
      value: "CUnit.spec"
    - name: monorepo-subdir
      value: "rpms/CUnit"
    - name: mock-config-template-filename-in-sources
      value: "mock/mock.cfg"
  pipelineRef:
    resolver: bundles
    params:
      - name: name
        value: build-rpm-package
      - name: kind
        value: pipeline
      - name: bundle
        # renovate: datasource=docker depName=quay.io/hummingbird-ci/rpmbuild-pipeline
        value: "quay.io/hummingbird-ci/rpmbuild-pipeline:latest@sha256:92ecfafac4f48a500112a3bc42924807aee41afe8679faf5279a970a33cb9895"
  taskRunTemplate:
    serviceAccountName: build-pipeline-cunit-main
  timeouts:
    pipeline: 4h
    tasks: 4h
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{git_auth_secret}}'
