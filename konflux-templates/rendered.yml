metadata:
  name: rpms-main-testing-farm-x86-64
  annotations:
    test.appstudio.openshift.io/pipeline_timeout: 10h
    test.appstudio.openshift.io/tasks_timeout: 9h
    test.appstudio.openshift.io/finally_timeout: 1h
