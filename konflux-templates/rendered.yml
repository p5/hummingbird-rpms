    - name: PIPELINE_MODE
      value: rpm
    - name: ARCH
      value: x86_64
    - name: IMAGE_TAG
      value: v3.5
  resolverRef:
    resolver: bundles
    params:
      - name: bundle
        value: quay.io/testing-farm/tmt-via-testing-farm:$(params.IMAGE_TAG)
      - name: name
        value: tmt-via-testing-farm
      - name: kind
        value: pipeline
      - name: url
        value: quay.io/testing-farm/tmt-via-testing-farm:$(params.IMAGE_TAG)
