apiVersion: appstudio.redhat.com/v1alpha1
kind: EnterpriseContractPolicy
metadata:
  name: registry-hummingbird
spec:
  description: >-
    Includes rules for levels 1, 2 & 3 of SLSA v0.1.
  publicKey: "k8s://openshift-pipelines/public-key"
  sources:
    - name: Release Policies
      ruleData:
        allowed_registry_prefixes:
          - quay.io/hummingbird-ci/
      data:
        - github.com/release-engineering/rhtap-ec-policy//data
        - oci::quay.io/konflux-ci/tekton-catalog/data-acceptable-bundles:latest
      policy:
        - oci::quay.io/enterprise-contract/ec-release-policy:konflux
      config:
        exclude: []
        include:
          - '@minimal'
          - '@slsa3'
---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlan
metadata:
  labels:
    release.appstudio.openshift.io/auto-release: "true"
    release.appstudio.openshift.io/standing-attribution: "true"
    release.appstudio.openshift.io/releasePlanAdmission: hummingbird-rpm-release
  name: hummingbird-rpm-release
spec:
  application: rpms-main
  target: hummingbird-tenant
---
apiVersion: appstudio.redhat.com/v1alpha1
kind: ReleasePlanAdmission
metadata:
  name: hummingbird-rpm-release
  namespace: hummingbird-tenant
  labels:
    release.appstudio.openshift.io/block-releases: 'false'
spec:
  applications:
    - rpms-main
  data:
    pulp:
      domain: public-hummingbird
      secretName: pulp-public-hummingbird-config-file-secret
    singleComponentMode: true
  origin: hummingbird-tenant
  pipeline:
    pipelineRef:
      params:
        - name: url
          value: 'https://github.com/konflux-ci/release-service-catalog.git'
        - name: revision
          value: 0fbe8d377db99dd697511d8008747ec6eed38582
        - name: pathInRepo
          value: pipelines/managed/push-rpms-to-pulp/push-rpms-to-pulp.yaml
      resolver: git
    serviceAccountName: hummingbird-rpm-release
    timeouts:
      pipeline: 4h0m0s
      tasks: 4h0m0s
  policy: registry-hummingbird
