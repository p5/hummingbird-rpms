---
rpmlint:
  command: |
    rpmlint "${TEST_RPM:?}"
  known_issues:
    - pattern: "W: obsolete-not-provided python2-rpm"
      description: "python2-rpm is obsolete and intentionally not provided"
      fails: "sometimes"
    - pattern: "E: non-executable-script /usr/lib/rpm/rpm.daily 644 /bin/sh"
      description: "rpm.daily script marked as non-executable"
      fails: "sometimes"
    - pattern: "W: non-etc-or-var-file-marked-as-conffile /usr/lib/sysimage/rpm/Index.db"
      description: "RPM database files marked as conffile outside /etc"
      fails: "sometimes"
    - pattern: "W: non-etc-or-var-file-marked-as-conffile /usr/lib/sysimage/rpm/Packages.db"
      description: "RPM database files marked as conffile outside /etc"
      fails: "sometimes"
    - pattern: "W: non-etc-or-var-file-marked-as-conffile /usr/lib/sysimage/rpm/rpmdb.sqlite"
      description: "RPM database files marked as conffile outside /etc"
      fails: "sometimes"
    - pattern: "W: non-etc-or-var-file-marked-as-conffile /usr/lib/sysimage/rpm/rpmdb.sqlite-shm"
      description: "RPM database files marked as conffile outside /etc"
      fails: "sometimes"
    - pattern: "W: non-etc-or-var-file-marked-as-conffile /usr/lib/sysimage/rpm/rpmdb.sqlite-wal"
      description: "RPM database files marked as conffile outside /etc"
      fails: "sometimes"
    - pattern: "W: non-coherent-filename test.rpm rpm-6.0.0-1.fc44.x86_64.rpm"
      description: "Test RPM filename does not match expected naming convention"
      fails: "sometimes"
    - pattern: "W: no-manual-page-for-binary rpmquery"
      description: "rpmquery binary has no manual page"
      fails: "sometimes"
    - pattern: "W: no-manual-page-for-binary rpmverify"
      description: "rpmverify binary has no manual page"
      fails: "sometimes"
    - pattern: "W: name-repeated-in-summary RPM"
      description: "Package name 'RPM' appears in summary"
      fails: "sometimes"
    - pattern: "W: install-file-in-docs /usr/share/doc/rpm/INSTALL"
      description: "INSTALL file included in documentation"
      fails: "sometimes"
    - pattern: "W: hidden-file-or-dir /usr/lib/sysimage/rpm/.rpm.lock"
      description: "Hidden lock file in RPM sysimage directory"
      fails: "sometimes"
    - pattern: "W: files-duplicate /usr/share/licenses/rpm/COPYING /usr/share/doc/rpm/COPYING"
      description: "COPYING file duplicated in licenses and docs directories"
      fails: "sometimes"
    - pattern: "W: empty-%postun"
      description: "Empty %postun script"
      fails: "sometimes"
    - pattern: "W: dangerous-command-in-%pre ln"
      description: "Hard link command used in %pre script"
      fails: "sometimes"
    - pattern: "W: cross-directory-hard-link /usr/lib/rpm/platform/(ia32e-linux|ppc32dy4-linux|ppc64pseries-linux|ppc64iseries-linux|ppc8260-linux|ppc8560-linux|ppciseries-linux|ppcpseries-linux|sparcv9-linux|x86_64-linux)/macros"
      description: "Cross-directory hard links for platform macros"
      fails: "sometimes"
    - pattern: "W: summary-ended-with-dot C Create daily logs of installed packages."
      description: "rpm-cron summary ends with a dot"
      fails: "sometimes"
    - pattern: "W: invalid-license GPL-2.0-or-later"
      description: "rpm-cron has invalid license format"
      fails: "sometimes"
    - pattern: "W: no-documentation"
      description: "rpm-cron package lacks documentation"
      fails: "sometimes"
    - pattern: "E: missing-dependency-to-cron for cron script /etc/cron.daily/rpm"
      description: "rpm-cron missing explicit dependency on cron package"
      fails: "sometimes"
    - pattern: "E: incoherent-logrotate-file /etc/logrotate.d/rpm"
      description: "rpm-cron logrotate configuration is incoherent"
      fails: "sometimes"
    - pattern: "W: invalid-license LGPL-2.1-or-later"
      description: "rpm-libs has invalid LGPL license format"
      fails: "sometimes"
    - pattern: "W: binaryinfo-objdump-failed /usr/lib64/librpm.so.10.6.0"
      description: "objdump failed to analyze librpm.so - unknown section type .relr.dyn"
      fails: "sometimes"
    - pattern: "E: missing-call-to-setgroups-before-setuid /usr/lib64/librpmio.so.10.6.0"
      description: "librpmio.so missing call to setgroups before setuid"
      fails: "sometimes"

src-rpmlint:
  command: |
    rpmlint "${TEST_RPM:?}"
  known_issues:
    - pattern: "W: name-repeated-in-summary C RPM"
      description: "Source RPM name 'RPM' appears in summary"
      fails: "sometimes"
    - pattern: "W: invalid-license GPL-2.0-or-later"
      description: "Source RPM has invalid license format"
      fails: "sometimes"
    - pattern: "E: hardcoded-library-path in \\$RPM_BUILD_ROOT/usr/lib/sysimage/rpm"
      description: "Hardcoded library path in RPM_BUILD_ROOT"
      fails: "sometimes"
    - pattern: "W: macro-in-comment %ghost"
      description: "Macro %ghost used in comment"
      fails: "sometimes"
    - pattern: "E: hardcoded-library-path in \\$RPM_BUILD_ROOT/usr/lib/sysimage/rpm/"
      description: "Hardcoded library path with trailing slash in RPM_BUILD_ROOT"
      fails: "sometimes"
    - pattern: "E: hardcoded-library-path in /usr/lib/sysimage/rpm"
      description: "Hardcoded library path /usr/lib/sysimage/rpm"
      fails: "sometimes"
    - pattern: "E: hardcoded-library-path in /usr/lib/sysimage/rpm/\\${rpmdb_file}"
      description: "Hardcoded library path with variable in /usr/lib/sysimage/rpm"
      fails: "sometimes"
    - pattern: "E: hardcoded-library-path in /usr/lib/sysimage/rpm/\\*"
      description: "Hardcoded library path with wildcard in /usr/lib/sysimage/rpm"
      fails: "sometimes"
    - pattern: "E: hardcoded-library-path in /usr/lib/sysimage/rpm/\\.\\*.lock"
      description: "Hardcoded library path for lock file in /usr/lib/sysimage/rpm"
      fails: "sometimes"
    - pattern: "W: macro-in-%changelog %_root_prefix"
      description: "Macro %_root_prefix used in changelog"
      fails: "sometimes"
    - pattern: "W: macro-in-%changelog %_sharedstatedir"
      description: "Macro %_sharedstatedir used in changelog"
      fails: "sometimes"
