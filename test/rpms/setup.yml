---
# Tests specific to the setup package
rpmlint:
  command: |
    rpmlint "${TEST_RPM:?}"
  known_issues:
    - pattern: "E: useless-provides (user|group)\\("
      description: "rpmlint flags user/group provides as useless for setup package"
      fails: "sometimes"
    - pattern: "E: zero-length /etc/(environment|exports|motd|subgid|subuid)"
      description: "Empty files in /etc are expected for setup package"
      fails: "sometimes"
    - pattern: "E: zero-length /usr/lib/motd"
      description: "Empty motd file is expected"
      fails: "sometimes"
    - pattern: "W: zero-perms /etc/(gshadow|shadow)"
      description: "Shadow files have zero perms by design"
      fails: "sometimes"
    - pattern: "E: standard-dir-owned-by-package /etc/profile\\.d"
      description: "setup package owns standard directories"
      fails: "sometimes"
    - pattern: "W: post-without-tmpfile-creation /usr/lib/tmpfiles\\.d/setup\\.conf"
      description: "tmpfiles.d warning for setup package"
      fails: "sometimes"
    - pattern: "W: only-non-binary-in-usr-lib"
      description: "setup package only has config files in /usr/lib"
      fails: "sometimes"
    - pattern: "W: non-etc-or-var-file-marked-as-conffile /usr/lib/motd"
      description: "motd file marked as conffile outside /etc"
      fails: "sometimes"
    - pattern: "W: non-conffile-in-etc"
      description: "Some /etc files not marked as conffile"
      fails: "sometimes"
    - pattern: "W: name-repeated-in-summary setup"
      description: "Package name appears in summary"
      fails: "sometimes"

src-rpmlint:
  command: |
    rpmlint "${TEST_RPM:?}"
  known_issues:
    - pattern: "W: name-repeated-in-summary"
      description: "Package name appears in summary"
      fails: "sometimes"
    - pattern: "E: spelling-error"
      description: "spelling error"
      fails: "sometimes"
    - pattern: "W: invalid-license"
      description: "W: invalid-license"
      fails: "sometimes"
    - pattern: "W: strange-permission"
      description: "W: strange-permission"
      fails: "sometimes"
    - pattern: "E: hardcoded-library-path"
      description: "E: hardcoded-library-path"
      fails: "sometimes"

content:
  command: |
    files=$(rpm -ql "${TEST_RPM:?}")
    for expected in /etc/environment /etc/services /usr/share/licenses/setup; do
      grep -q -F -x "$expected" <<<"$files" || TEST_FAIL "Expected file $expected not found in RPM"
    done
