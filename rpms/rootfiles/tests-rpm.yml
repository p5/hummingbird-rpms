---
# Tests specific to the setup package
rpmlint:
  command: |
    rpmlint "${TEST_RPM:?}"
  known_issues:
    - pattern: "E: spelling-error"
      description: "rpmlint flags spelling error"
      fails: "sometimes"

src-rpmlint:
  command: |
    # Run rpmlint on source RPM
    rpmlint "${TEST_SRC_RPM}"
  known_issues:
    - pattern: "E: spelling-error"
      description: "rpmlint flags spelling error"
      fails: "sometimes"
