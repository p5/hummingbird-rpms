specfile_path: man-db.spec

upstream_package_name: man-db
downstream_package_name: man-db

upstream_project_url: https://gitlab.com/man-db/man-db

jobs:
  - job: pull_from_upstream
    trigger: release
    dist_git_branches:
      - fedora-rawhide

  - job: koji_build
    trigger: commit
    allowed_pr_authors:
      - packit
      - all_admins
    allowed_committers:
      - all_admins
    dist_git_branches:
      - fedora-all

  - job: bodhi_update
    trigger: commit
    allowed_builders:
      - packit
      - all_admins
    dist_git_branches:
      - fedora-branched # rawhide updates are created automatically
