---
# Default tests for all default (runtime) rpms
# These are minimal tests that should pass for all rpms
hum-suffix-check:
  command: |
    # Verify the RPM was built with the Hummingbird dist suffix (.hum<N>)
    # rather than the default Fedora suffix (.fc<NN>)
    release=$(rpm -qp --queryformat '%{RELEASE}' "${TEST_RPM:?}")

    # Check that release contains .hum<N> suffix
    if [[ ! ${release} =~ \.hum[0-9]+$ ]]; then
      TEST_FAIL "RPM release '${release}' does not have .hum<N> suffix - mock configuration may not be working correctly"
    fi

    echo "RPM release '${release}' has correct Hummingbird suffix"

rpm-integrity-check:
  command: |
    rpm -K "${TEST_RPM:?}"
    rpm -qip "${TEST_RPM:?}"
    rpm -qlp "${TEST_RPM:?}"
    rpm -qRp "${TEST_RPM:?}"

rpm-install:
  command: |
    # Test installing the RPM using dnf-installroot in a container

    # Get the package name from the RPM
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")

    # Create a temporary directory for the local repository
    build_dir=$(mktemp -d)

    # Ensure cleanup on exit
    cleanup() {
      rm -rf "${build_dir}"
    }
    trap cleanup EXIT

    # Create local-repo directory
    mkdir -p "${build_dir}/local-repo"

    # Determine which RPMs to include in the local repository
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      # Use all RPMs from the repository directory
      rpm_files=("${TEST_REPO_DIR}"/*.rpm)
    else
      # Fall back to just the test RPM
      rpm_files=("${TEST_RPM}")
    fi

    # Copy RPM files to local-repo
    for rpm_file in "${rpm_files[@]}"; do
      cp "${rpm_file}" "${build_dir}/local-repo/"
    done

    # Run createrepo_c in a container to generate repository metadata
    "${TEST_ENGINE}" run --rm --user 0 -e HOME=/root \
      -v "${build_dir}/local-repo:/repo:z" \
      quay.io/hummingbird-ci/builder:latest \
      createrepo_c /repo

    echo "Created local repository with $(ls -1 "${build_dir}/local-repo/"*.rpm | wc -l) RPM(s)"

    # Run installation test in a container
    # Mount repo configs and local-repo, run all operations in a single bash script
    "${TEST_ENGINE}" run --rm \
      --cap-add=ALL \
      -v "$(cd .. && pwd)/repos:/tmp/repos:ro,z" \
      -v "${build_dir}/local-repo:/tmp/local-repo:ro,z" \
      quay.io/hummingbird-ci/builder:latest-hatchling \
      bash -c '
        set -e  # Exit immediately on any error

        # Copy repo configurations
        cp /tmp/repos/rawhide.repo /etc/yum.repos.d/
        cp /tmp/repos/hummingbird.repo /etc/yum.repos.d/

        # Create local.repo config
        printf "%s\n" \
          "[local-repo]" \
          "name=Local Repository" \
          "baseurl=file:///tmp/local-repo" \
          "enabled=1" \
          "gpgcheck=0" \
          "priority=1" \
          > /etc/yum.repos.d/local.repo

        # Define DNF variables
        NEWROOT=/new-root-fs
        DNF_CACHE=/tmp/dnf-cache
        DNF_FLAGS="-y --use-host-config --nodocs --setopt=install_weak_deps=False --setopt=cachedir=${DNF_CACHE} --setopt=system_cachedir=${DNF_CACHE} --setopt=logdir=${DNF_CACHE} --setopt=varsdir=${DNF_CACHE}"

        # Create new root directory
        mkdir -p "${NEWROOT}"

        # Import GPG key
        rpmkeys --import /etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-rawhide-primary --root "${NEWROOT}"

        # Install filesystem first, then the test package
        dnf-installroot "${NEWROOT}" ${DNF_FLAGS} install filesystem
        dnf-installroot "${NEWROOT}" ${DNF_FLAGS} install '"${rpm_name}"'

        # Verify the package was installed from local-repo
        install_repo=$(dnf --installroot="${NEWROOT}" info --installed '"${rpm_name}"' 2>/dev/null | \
          grep "^From repo" | cut -d: -f2 | tr -d " ")

        if [ "${install_repo}" != "local-repo" ]; then
          echo "Error: Package '"'${rpm_name}'"' was not installed from local-repo (got: ${install_repo:-unknown})"
          exit 1
        fi

        echo "Verified: '"${rpm_name}"' installed from local-repo"
      '

# Source RPM tests (only run when --src-rpm is provided)
src-rpm-hum-suffix-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Verify the source RPM was built with the Hummingbird dist suffix (.hum<N>)
    # rather than the default Fedora suffix (.fc<NN>)
    release=$(rpm -qp --queryformat '%{RELEASE}' "${TEST_SRC_RPM}")

    # Check that release contains .hum<N> suffix
    if [[ ! ${release} =~ \.hum[0-9]+$ ]]; then
      TEST_FAIL "Source RPM release '${release}' does not have .hum<N> suffix - mock configuration may not be working correctly"
    fi

    echo "Source RPM release '${release}' has correct Hummingbird suffix"

src-rpm-integrity-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Check source RPM signature and metadata
    rpm -K "${TEST_SRC_RPM}"
    rpm -qip "${TEST_SRC_RPM}"
    rpm -qlp "${TEST_SRC_RPM}"
