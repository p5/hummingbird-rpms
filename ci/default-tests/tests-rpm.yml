---
# Default tests for all default (runtime) rpms
# These are minimal tests that should pass for all rpms
hum-suffix-check:
  command: |
    # Verify the RPM was built with the Hummingbird dist suffix (.hum<N>)
    # rather than the default Fedora suffix (.fc<NN>)
    release=$(rpm -qp --queryformat '%{RELEASE}' "${TEST_RPM:?}")

    # Check that release contains .hum<N> suffix
    if [[ ! ${release} =~ \.hum[0-9]+$ ]]; then
      TEST_FAIL "RPM release '${release}' does not have .hum<N> suffix - mock configuration may not be working correctly"
    fi

    echo "RPM release '${release}' has correct Hummingbird suffix"

rpm-integrity-check:
  command: |
    rpm -K "${TEST_RPM:?}"
    rpm -qip "${TEST_RPM:?}"
    rpm -qlp "${TEST_RPM:?}"
    rpm -qRp "${TEST_RPM:?}"

rpm-install:
  command: |
    # Test installing the RPM using dnf-installroot

    # Get the package name from the RPM
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")

    # Create a temporary directory for the build context
    build_dir=$(mktemp -d)

    # Ensure cleanup on exit
    cleanup() {
      rm -rf "${build_dir}"
    }
    trap cleanup EXIT

    # Copy the Containerfile to the build context
    cp ../rpm-install-test.Containerfile "${build_dir}/Containerfile"

    # Copy repo configs to the build context
    cp -r ../repos "${build_dir}/repos"

    # Create local-repo directory in build context
    mkdir -p "${build_dir}/local-repo"

    # Determine which RPMs to include in the local repository
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      # Use all RPMs from the repository directory
      rpm_files=("${TEST_REPO_DIR}"/*.rpm)
    else
      # Fall back to just the test RPM
      rpm_files=("${TEST_RPM}")
    fi

    # Copy RPM files to local-repo and create repository metadata
    for rpm_file in "${rpm_files[@]}"; do
      cp "${rpm_file}" "${build_dir}/local-repo/"
    done

    # Run createrepo_c in a container to generate repository metadata
    "${TEST_ENGINE}" run --rm --user 0 -e HOME=/root \
      -v "${build_dir}/local-repo:/repo:z" \
      quay.io/hummingbird-ci/builder:latest \
      createrepo_c /repo

    echo "Created local repository with $(ls -1 "${build_dir}/local-repo/"*.rpm | wc -l) RPM(s)"

    # Build the image, installing the package by name from the local repository.
    # The Containerfile verifies:
    #   1. The package is installed (rpm -q)
    #   2. The package came from local-repo (dnf info)
    sanitized_name="${rpm_name//[^a-zA-Z0-9._-]/-}"
    test_image="rpm-install-test:${sanitized_name}-$$"
    "${TEST_ENGINE}" build \
      -t "${test_image}" \
      --cap-add=ALL \
      --build-arg PACKAGE_NAME="${rpm_name}" \
      "${build_dir}"

    # Cleanup the test image
    "${TEST_ENGINE}" rmi -f "${test_image}" 2>/dev/null || true

# Source RPM tests (only run when --src-rpm is provided)
src-rpm-hum-suffix-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Verify the source RPM was built with the Hummingbird dist suffix (.hum<N>)
    # rather than the default Fedora suffix (.fc<NN>)
    release=$(rpm -qp --queryformat '%{RELEASE}' "${TEST_SRC_RPM}")

    # Check that release contains .hum<N> suffix
    if [[ ! ${release} =~ \.hum[0-9]+$ ]]; then
      TEST_FAIL "Source RPM release '${release}' does not have .hum<N> suffix - mock configuration may not be working correctly"
    fi

    echo "Source RPM release '${release}' has correct Hummingbird suffix"

src-rpm-integrity-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Check source RPM signature and metadata
    rpm -K "${TEST_SRC_RPM}"
    rpm -qip "${TEST_SRC_RPM}"
    rpm -qlp "${TEST_SRC_RPM}"
