---
# Default tests for all default (runtime) rpms
# These are minimal tests that should pass for all rpms
rpm-integrity-check:
  command: |
    rpm -K "${TEST_RPM:?}"
    rpm -qip "${TEST_RPM:?}"
    rpm -qlp "${TEST_RPM:?}"
    rpm -qRp "${TEST_RPM:?}"

rpmlint:
  command: |
    rpmlint "${TEST_RPM:?}"

rpm-install:
  command: |
    # Test installing the RPM using dnf-installroot

    # Get the package name from the RPM
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")

    # If TEST_REPO_DIR is provided, create a local repository
    repo_dir=""
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      # Create local repository using create-local-repo.sh
      # This script runs from ci/default-tests directory, so ../create-local-repo.sh is in ci/
      repo_dir=$(bash ../create-local-repo.sh --engine "${TEST_ENGINE}" --image "${TEST_IMAGE}" "${TEST_REPO_DIR}"/*.rpm)
      echo "Created local repository at: ${repo_dir}"
    fi

    # Create a temporary directory for the build context
    build_dir=$(mktemp -d)

    # Ensure cleanup on exit
    cleanup() {
      rm -rf "${build_dir}"
      [[ -n ${repo_dir} ]] && rm -rf "${repo_dir}"
    }
    trap cleanup EXIT

    # Copy the RPM to the build context
    cp "${TEST_RPM:?}" "${build_dir}/test.rpm"

    # Copy the Containerfile to the build context
    cp ../rpm-install-test.Containerfile "${build_dir}/Containerfile"

    # Create local-repo directory in build context
    mkdir -p "${build_dir}/local-repo"

    # If we have a local repo, copy its contents and set build arg
    local_repo_arg=""
    if [[ -n ${repo_dir} ]]; then
      cp -r "${repo_dir}"/* "${build_dir}/local-repo/"
      local_repo_arg="--build-arg LOCAL_REPO=true"
    fi

    # Build the image
    test_image="rpm-install-test:${rpm_name}-$$"
    "${TEST_ENGINE}" build \
      -t "${test_image}" \
      --cap-add=ALL \
      ${local_repo_arg} \
      "${build_dir}"

    # Verify the package is installed in the final scratch image
    "${TEST_ENGINE}" run --rm "${test_image}" rpm -q "${rpm_name}"

    # Cleanup the test image
    "${TEST_ENGINE}" rmi -f "${test_image}" 2>/dev/null || true

# Source RPM tests (only run when --src-rpm is provided)
src-rpm-integrity-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Check source RPM signature and metadata
    rpm -K "${TEST_SRC_RPM}"
    rpm -qip "${TEST_SRC_RPM}"
    rpm -qlp "${TEST_SRC_RPM}"

src-rpmlint:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Run rpmlint on source RPM
    rpmlint "${TEST_SRC_RPM}"

src-rpm-rebuild:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Test rebuilding the source RPM in a container
    # Create a container with a command that keeps it running
    container_id=$("${TEST_ENGINE:?}" create --entrypoint sleep "${TEST_IMAGE:?}" infinity)

    # Ensure cleanup on exit
    cleanup() {
      "${TEST_ENGINE}" rm -f "${container_id}" 2>/dev/null || true
    }
    trap cleanup EXIT

    # Copy source RPM into container
    "${TEST_ENGINE}" cp "${TEST_SRC_RPM}" "${container_id}:/tmp/test.src.rpm"

    # Start the container
    "${TEST_ENGINE}" start "${container_id}"

    # Install build dependencies
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" dnf install -y rpm-build dnf-plugins-core

    # Install the source RPM
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" rpm -i /tmp/test.src.rpm

    # Find the spec file
    spec_file=$("${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" find /root/rpmbuild/SPECS -name "*.spec" -type f | head -n1)

    if [[ -z ${spec_file} ]]; then
      echo "Error: No spec file found in /root/rpmbuild/SPECS/"
      "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" ls -la /root/rpmbuild/SPECS/ || true
      exit 1
    fi

    echo "Found spec file: ${spec_file}"

    # Install build dependencies for the package
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" dnf builddep -y /tmp/test.src.rpm

    # Try to rebuild the package
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" rpmbuild -bb --define "_topdir /root/rpmbuild" "${spec_file}"

    # Verify RPMs were built
    "${TEST_ENGINE}" exec --user 0 -e HOME=/root "${container_id}" find /root/rpmbuild/RPMS/ -name "*.rpm" -type f

    # Cleanup
    "${TEST_ENGINE}" stop "${container_id}"
    "${TEST_ENGINE}" rm -f "${container_id}"
