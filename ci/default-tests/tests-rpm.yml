---
# Default tests for all default (runtime) rpms
# These are minimal tests that should pass for all rpms
rpm-integrity-check:
  command: |
    rpm -K "${TEST_RPM:?}"
    rpm -qip "${TEST_RPM:?}"
    rpm -qlp "${TEST_RPM:?}"
    rpm -qRp "${TEST_RPM:?}"

rpm-install:
  command: |
    # Test installing the RPM using dnf-installroot

    # Get the package name from the RPM
    rpm_name=$(rpm -qp --queryformat '%{NAME}' "${TEST_RPM}")

    # If TEST_REPO_DIR is provided, create a local repository
    repo_dir=""
    if [[ -n ${TEST_REPO_DIR:-} ]]; then
      # Create local repository using create-local-repo.sh
      # This script runs from ci/default-tests directory, so ../create-local-repo.sh is in ci/
      repo_dir=$(bash ../create-local-repo.sh --engine "${TEST_ENGINE}" --image "${TEST_IMAGE}" "${TEST_REPO_DIR}"/*.rpm)
      echo "Created local repository at: ${repo_dir}"
    fi

    # Create a temporary directory for the build context
    build_dir=$(mktemp -d)

    # Ensure cleanup on exit
    cleanup() {
      rm -rf "${build_dir}"
      if [[ -n ${repo_dir} ]]; then
        rm -rf "${repo_dir}"
      fi
    }
    trap cleanup EXIT

    # Copy the RPM to the build context
    cp "${TEST_RPM:?}" "${build_dir}/test.rpm"

    # Copy the Containerfile to the build context
    cp ../rpm-install-test.Containerfile "${build_dir}/Containerfile"

    # Create local-repo directory in build context
    mkdir -p "${build_dir}/local-repo"

    # If we have a local repo, copy its contents and set build arg
    local_repo_arg=""
    if [[ -n ${repo_dir} ]]; then
      cp -r "${repo_dir}"/* "${build_dir}/local-repo/"
      local_repo_arg="--build-arg LOCAL_REPO=true"
    fi

    # Build the image
    test_image="rpm-install-test:${rpm_name}-$$"
    "${TEST_ENGINE}" build \
      -t "${test_image}" \
      --cap-add=ALL \
      ${local_repo_arg} \
      "${build_dir}"

    # Verify the package is installed in the final scratch image
    "${TEST_ENGINE}" run --rm "${test_image}" rpm -q "${rpm_name}"

    # Cleanup the test image
    "${TEST_ENGINE}" rmi -f "${test_image}" 2>/dev/null || true

# Source RPM tests (only run when --src-rpm is provided)
src-rpm-integrity-check:
  command: |
    # Only run if TEST_SRC_RPM is provided
    if [[ -z ${TEST_SRC_RPM} ]]; then
      echo "Skipping: No source RPM provided"
      exit 0
    fi

    # Check source RPM signature and metadata
    rpm -K "${TEST_SRC_RPM}"
    rpm -qip "${TEST_SRC_RPM}"
    rpm -qlp "${TEST_SRC_RPM}"

