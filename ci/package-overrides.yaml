# This file contains per-package overrides for build configuration.
# If a package is not listed in this file, it will use default settings.
#
# Available options per package:
#   timeout_hours: Override the default build timeout (default: 4 hours)
#   build_platforms: Override the default MPLs (instance sizes) for builds
#   forked_from: Override the upstream dist-git repository URL for lookaside cache resolution
#                (default: https://src.fedoraproject.org/rpms/<package-name>)
#
# Example:
# llvm:
#   timeout_hours: 12
#   build_platforms:
#     - "linux-d160-c8xlarge/arm64"
#     - "linux-d160-c8xlarge/amd64"
#   task_run_specs:
#     - pipelineTaskName: upload-to-quay
#       stepSpecs:
#         - name: run-syft
#           computeResources:
#             requests:
#               memory: 10Gi
#             limits:
#               memory: 10Gi
#
# All available MPLs can be found in the:
# https://konflux.pages.redhat.com/docs/users/getting-started/multi-platform-builds.html documentation.

ruff:
  timeout_hours: 8
  build_platforms:
    - "linux-d160-c8xlarge/arm64"
    - "linux-d160-c8xlarge/amd64"

java-25-openjdk:
  timeout_hours: 8
  build_platforms:
    - "linux-d160-c8xlarge/arm64"
    - "linux-d160-c8xlarge/amd64"

setup:
  timeout_hours: 12

dotnet8.0:
  # Use machines with 320GB disk space for large builds
  build_platforms:
    - "linux-d320-c4xlarge/arm64"
    - "linux-d320-c4xlarge/amd64"

dotnet9.0:
  # Use machines with 320GB disk space for large builds
  build_platforms:
    - "linux-d320-c4xlarge/arm64"
    - "linux-d320-c4xlarge/amd64"

dotnet10.0:
  # Use machines with 320GB disk space for large builds
  build_platforms:
    - "linux-d320-c4xlarge/arm64"
    - "linux-d320-c4xlarge/amd64"

glibc:
  timeout_hours: 16
  build_platforms:
    - "linux-d160-c8xlarge/arm64"
    - "linux-d160-c8xlarge/amd64"

gcc:
  # Larger builders are required for the build to complete in a reasonable time
  timeout_hours: 12
  build_platforms:
    - "linux-d160-c8xlarge/amd64"
    - "linux-d160-c8xlarge/arm64"

openssl-fips-provider:
  # Use hummingbird lookaside cache instead of Fedora
  forked_from: "https://gitlab.com/redhat/hummingbird/rpms"
